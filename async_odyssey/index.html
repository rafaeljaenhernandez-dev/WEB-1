<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Async Odyssey: una Pokédex con la PokeAPI. Elige región, busca, filtra por tipo y abre la ficha de cualquier Pokémon."
    />
    <title>Async Odyssey · Pokédex</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header class="cabecera">
      <div class="cabecera__dentro">
        <span class="lente" aria-hidden="true"></span>
        <span class="luces" aria-hidden="true"><span></span><span></span><span></span></span>
        <div>
          <h1 class="titulo">Async Odyssey</h1>
          <p class="lema">La Pokédex: elige una región, busca, filtra por tipo y abre la ficha de cualquier Pokémon.</p>
        </div>
      </div>
    </header>

    <main class="consola">
      <section id="ficha" class="ficha" aria-live="polite" aria-label="Ficha del Pokémon"></section>

      <section class="pokedex" aria-labelledby="titulo-pokedex">
        <h2 id="titulo-pokedex" class="pokedex__titulo">Pokédex</h2>

        <form id="mandos" class="mandos" role="search">
          <fieldset id="regiones" class="regiones">
            <legend class="campo__nombre">Región</legend>
          </fieldset>
          <label class="campo campo--texto">
            <span class="campo__nombre">Busca por nombre o número</span>
            <input type="search" name="texto" placeholder="pikachu, 25, #150…" autocomplete="off" />
          </label>
          <label class="campo">
            <span class="campo__nombre">Tipo</span>
            <select id="tipo" name="tipo">
              <option value="todos">Todos los tipos</option>
            </select>
          </label>
          <label class="campo">
            <span class="campo__nombre">Orden</span>
            <select name="orden">
              <option value="numero">Por número</option>
              <option value="az">De la A a la Z</option>
              <option value="za">De la Z a la A</option>
            </select>
          </label>
        </form>

        <p id="resumen" class="resumen" aria-live="polite"></p>
        <div id="lista" class="lista" aria-live="polite"></div>
      </section>
    </main>

    <footer class="pie">
      <p>
        Datos: <a href="https://pokeapi.co" rel="noopener">PokeAPI</a> · fetch + async/await · módulos ES · Vite
      </p>
    </footer>
  </body>
</html>
