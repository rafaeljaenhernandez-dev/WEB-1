<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Async Odyssey: el garaje de los deportivos, con datos reales de la NHTSA y fichas de Wikipedia."
    />
    <title>Async Odyssey · El garaje de los deportivos</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header class="cabecera">
      <h1 class="titulo">Async Odyssey</h1>
      <p class="lema">El garaje de los deportivos: diez marcas, una petición por marca y todas a la vez.</p>
    </header>

    <main class="pista">
      <section id="vitrina" class="vitrina" aria-live="polite" aria-labelledby="vitrina-modelo">
        <div class="vitrina__texto">
          <h2 id="vitrina-modelo" class="vitrina__modelo"></h2>
          <p class="vitrina__resumen"></p>
          <div class="vitrina__acciones"></div>
        </div>
        <figure class="vitrina__foto"></figure>
      </section>

      <section class="garaje" aria-labelledby="titulo-garaje">
        <h2 id="titulo-garaje" class="garaje__titulo">El garaje</h2>

        <form id="mandos" class="mandos" role="search">
          <label class="campo campo--texto">
            <span class="campo__nombre">Busca un modelo</span>
            <input type="search" name="texto" placeholder="P1, Huracan, 911…" autocomplete="off" />
          </label>
          <label class="campo">
            <span class="campo__nombre">Orden</span>
            <select name="orden">
              <option value="az">De la A a la Z</option>
              <option value="za">De la Z a la A</option>
            </select>
          </label>
          <fieldset id="marcas" class="marcas">
            <legend class="campo__nombre">Marca</legend>
          </fieldset>
        </form>

        <div id="resumen" class="resumen" aria-live="polite"></div>
        <div id="garaje" class="garaje__lista" aria-live="polite"></div>
      </section>
    </main>

    <footer class="pie">
      <p>
        Modelos: <a href="https://vpic.nhtsa.dot.gov/api/" rel="noopener">NHTSA vPIC</a> · Fichas y fotos:
        <a href="https://es.wikipedia.org" rel="noopener">Wikipedia</a> · fetch + async/await · Vite
      </p>
    </footer>
  </body>
</html>
